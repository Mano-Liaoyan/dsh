# Keeps upstream workflows disabled in Mano-Liaoyan/dsh. They target
# deepseek-ai's enterprise and self-hosted runners and release credentials, so
# in this fork they would queue forever or fail. Disabling is repository state,
# not a file edit, which keeps .github/workflows identical to upstream.
#
# Runs after every push to master (including upstream syncs that add new
# workflows) and on demand. Only .github/workflows/fork-*.yml stay enabled.
name: Fork upstream workflows

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  disable:
    name: disable upstream workflows
    runs-on: ubuntu-latest
    steps:
      - name: Disable every workflow except fork-*.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | select(.path | startswith(".github/workflows/")) | select(.path | test("^\\.github/workflows/fork-[^/]+\\.yml$") | not) | "\(.id)\t\(.path)"' |
          while IFS=$'\t' read -r id path; do
            echo "Disabling $path"
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable"
          done
