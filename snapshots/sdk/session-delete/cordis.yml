# Opt-in deletion over the shipped SDK profile; storage remains inside the test home.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: time-context
  name: '@deepseek-ai/dsh-time-context'
  disabled: true

- insert:
    - id: session-delete
      name: '@deepseek-ai/dsh-session-delete'
    - id: session-delete-snapshot-fixture
      name: './fixture.mjs'
